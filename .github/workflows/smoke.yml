name: Smoke test all sources

# One-off: load every source (including retired ones) from GitHub's servers.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated source ids (blank = all)"
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python collector/collect.py --smoke ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - if: always()
        run: collector/commit_and_push.sh "Smoke test" runs

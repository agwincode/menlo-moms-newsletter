name: Collect (Friday morning)

# Friday ~8:15am Pacific in summer, ~7:15am in winter (GitHub schedules run in UTC).
on:
  schedule:
    - cron: "17 15 * * 5"
  workflow_dispatch:
    inputs:
      friday:
        description: "Target weekend's Friday (YYYY-MM-DD). Blank = the weekend after next Friday."
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Collect sources and weather
        run: python collector/collect.py ${{ inputs.friday && format('--friday {0}', inputs.friday) || '' }}
      - name: Save snapshots
        if: always()
        run: collector/commit_and_push.sh "Collect sources" runs

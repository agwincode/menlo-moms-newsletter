name: Refresh weather (Sun–Thu mornings)

# ~6:20am Pacific in summer, ~5:20am in winter.
on:
  schedule:
    - cron: "23 13 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - run: python collector/refresh_weather.py
      - run: collector/commit_and_push.sh "Refresh weather" drafts runs

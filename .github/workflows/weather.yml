name: Refresh weather (Sat and Sun mornings)

# ~5:15am Pacific in summer, ~4:15am in winter, before the Sunday refresh.
on:
  schedule:
    - cron: "17 12 * * 6,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - run: python collector/refresh_weather.py
      - run: collector/commit_and_push.sh "Refresh weather" drafts runs
